# Company facts and contact details, used across the site.
#
# Any value left empty (~) is rendered as a conspicuous "To confirm"
# placeholder, so nothing unconfirmed is published silently. Fill these in
# before publication; see the checklist in README.md.

legal_name: Zeth Ltd
short_name: Zeth

# Officers, as listed on the Companies House register.
directors:
  - Zeth
  - Jutta
company_secretary: Jutta

# Legal identity -- REQUIRED before publication.
company_number: "10657524" # e.g. "12345678" (Companies House registration number)
company_type: Private limited company
jurisdiction: England and Wales
registered_office: ~     # Full registered office address, one line
vat_number: ~            # Leave empty if not VAT-registered; the row is then hidden
                         # unless show_vat is true.
show_vat: false

# Contact -- REQUIRED before publication.
email: hello@zeth.net
privacy_email: privacy@zeth.net   # used on the Zeth Ltd privacy notice
cv_on_request: true

# Links
github_personal: https://github.com/zeth
github_company: ~        # e.g. "https://github.com/<organisation>"
linkedin: ~              # optional

holder:
  name: Holder
  tagline: Your knowledge belongs to you.
  url: https://holder.team/
  github: https://github.com/HolderTeam/
  privacy_policy: https://holder.team/privacy/
  privacy_email: privacy@holder.team   # the address given in Holder's privacy policy and to Apple
